services:
  - type: web
    name: ge-developer
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /skills
        destination: /skills.html
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /projects
        destination: /projects.html
      - type: rewrite
        source: /testimonials
        destination: /testimonials.html
      - type: rewrite
        source: /blog
        destination: /blog.html
      - type: rewrite
        source: /contact
        destination: /contact.html
