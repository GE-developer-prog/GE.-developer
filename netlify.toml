[build]
  command = "npm run build"
  publish = "dist"

# Redirect .html URLs to clean URLs
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/skills.html"
  to = "/skills"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/projects.html"
  to = "/projects"
  status = 301

[[redirects]]
  from = "/testimonials.html"
  to = "/testimonials"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

